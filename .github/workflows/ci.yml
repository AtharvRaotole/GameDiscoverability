name: CI

# Disabled - uncomment to enable CI checks
# on:
#   push:
#     branches: [main, develop]
#   pull_request:
#     branches: [main, develop]

on:
  workflow_dispatch: # Only runs manually if needed

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (type checking happens during build)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
        continue-on-error: true

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (type checking happens during build)
        run: npm run build
        continue-on-error: true

